<router-outlet></router-outlet>

<div class="app-container" *ngIf="!esRutaExterna">
  
  <header class="app-header">
    <h1 class="app-title">⚓ RUMBO</h1>
    <p class="app-subtitle">Consulta de carburantes — Ministerio para la Transición Ecológica</p>
  </header>

  <div class="controls">
    <mat-form-field appearance="outline">
      <mat-label>Comunidad Autónoma</mat-label>
      <mat-select [(ngModel)]="selectedCCAA" (ngModelChange)="onCCAAChange($event)">
        <mat-option *ngFor="let ccaa of comunidades" [value]="ccaa.IDCCAA">
          {{ccaa.CCAA}}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Provincia</mat-label>
      <mat-select [(ngModel)]="selectedProvincia" (ngModelChange)="onProvinciaChange($event)">
        <mat-option *ngFor="let prov of provincias" [value]="prov.IDPovincia">
          {{prov.Provincia}}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <mat-tab-group>
    <mat-tab label="Estaciones terrestres">
      <app-estaciones [idCCAA]="selectedCCAA"></app-estaciones>
    </mat-tab>
    <mat-tab label="Postes marítimos">
      <app-postes-maritimos [idProvincia]="selectedProvincia"></app-postes-maritimos>
    </mat-tab>
    <mat-tab label="Precios históricos">
      <app-precios-historicos [idProvincia]="selectedProvincia"></app-precios-historicos>
    </mat-tab>
    <mat-tab label="Acerca de">
      <app-acerca-de></app-acerca-de>
    </mat-tab>    
  </mat-tab-group>

</div>
